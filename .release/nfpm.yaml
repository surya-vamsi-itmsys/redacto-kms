arch: ${GOARCH}
platform: ${GOOS}
version: ${VERSION}
vendor: Redacto KMS
name: redacto-kms
maintainer: Redacto KMS
description: |
  Redacto KMS provides a software solution to manage, store, and distribute
  sensitive data including secrets, certificates, and keys.
license: "*"
provides:
 - redacto-kms
depends:
 - openssl
section: default
contents:
  - src: ./bin/redacto-kms
    dst: /usr/bin/redacto-kms
    file_info:
      mode: 0755
  - src: ./LICENSE
    dst: /usr/share/doc/redacto-kms/copyright
    file_info:
      mode: 0644
  - src: ./.release/linux/package/etc/redacto-kms/redacto-kms.env
    dst: /etc/redacto-kms/redacto-kms.env
    type: config|noreplace
    file_info:
      mode: 0644
  - src: ./.release/linux/package/etc/redacto-kms/redacto-kms.hcl
    dst: /etc/redacto-kms/redacto-kms.hcl
    type: config|noreplace
    file_info:
      mode: 0644
  - src: ./.release/linux/package/usr/lib/systemd/system/redacto-kms.service
    dst: /usr/lib/systemd/system/redacto-kms.service
    type: config|noreplace
    file_info:
      mode: 0644
scripts:
  preinstall: ./.release/linux/preinst
  postinstall: ./.release/linux/postinst
  postremove: ./.release/linux/postrm
deb:
  signature:
    key_file: ${GPG_KEY_FILE}
rpm:
  signature:
    key_file: ${GPG_KEY_FILE}
