name: Release container images

on:
  release:
    types:
      - published

  # The manual trigger can be used to rebuild images based on later based images
  # and packages without creating a new release/tag.
  workflow_dispatch:
    inputs:
      version:
        description: Version to (re-)release, e.g., v2.0.0
        required: true
        type: string
      distro:
        description: Distribution to (re-)release
        default: all
        type: choice
        options:
          - all
          - redacto-kms
          - redacto-kms-distroless
          - redacto-kms-ubi

  # This trigger is called directly by "release.yml" to automatically trigger
  # image releases on nightly releases.
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      distro:
        default: all
        type: string

env:
  # Pick the right version input based on the workflow trigger.
  VERSION: ${{ case(github.event_name == 'release', github.ref_name, inputs.version) }}

permissions:
  contents: read

jobs:
  release:
    name: ${{ matrix.distro.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: redacto-kms
            target: default
            include: >-
              ${{
                github.event_name == 'release' ||
                contains(fromJSON('["all", "redacto-kms"]'), inputs.distro)
              }}
            platforms:
              - linux/amd64
              - linux/arm64
              - linux/arm/v6
              - linux/ppc64le
              - linux/riscv64
              - linux/s390x
          - name: redacto-kms-ubi
            target: ubi
            include: >-
              ${{
                github.event_name == 'release' ||
                contains(fromJSON('["all", "redacto-kms-ubi"]'), inputs.distro)
              }}
            platforms:
              - linux/amd64
              - linux/arm64
              - linux/ppc64le
              - linux/s390x
          - name: redacto-kms-distroless
            target: distroless
            include: >-
              ${{
                github.event_name == 'release' ||
                contains(fromJSON('["all", "redacto-kms-distroless"]'), inputs.distro)
              }}
            platforms:
              - linux/amd64
              - linux/arm64
              - linux/arm
              - linux/ppc64le
              - linux/riscv64
              - linux/s390x
        exclude:
          - distro:
              include: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Determine tags
        id: tags
        run: ./scripts/release/container-tags.sh
        env:
          IMAGE_NAME: ${{ github.repository_owner }}/${{ matrix.distro.name }}${{ case(contains(env.VERSION, 'nightly'), '-nightly', '') }}

      - name: Log into ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: contains(fromJSON(steps.tags.outputs.registries), 'ghcr.io')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into docker.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: contains(fromJSON(steps.tags.outputs.registries), 'docker.io')
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log into quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: contains(fromJSON(steps.tags.outputs.registries), 'quay.io')
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Download release artifacts
        run: |
          ./scripts/release/download-artifacts.sh
          ./scripts/release/extract-linux-binaries.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PATTERN: redacto-kms_*_linux_*.tar.gz

      - name: Get release info
        id: info
        run: |
          echo "sha=$(git rev-parse "$VERSION")" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct "$VERSION")" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=UTC git log -1 --format=%cd --date=iso-strict-local "$VERSION")" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ join(fromJSON(steps.tags.outputs.tags), ',') }}
          target: ${{ matrix.distro.target }}
          platforms: ${{ join(matrix.distro.platforms, ',') }}
          outputs: type=registry,rewrite-timestamp=true
          build-args: SOURCE_DATE_EPOCH=${{ steps.info.outputs.epoch }}
          # We add both "legacy" non-namespaced labels and OCI-standardized
          # labels. Legacy labels are primarily required for Red Hat to certify
          # images based on UBI, but it does not harm to add them to all
          # distributions.
          labels: |
            name=Redacto KMS
            maintainer=Redacto KMS
            vendor=Redacto KMS
            version=${{ env.VERSION }}
            release=${{ steps.info.outputs.epoch }}
            build-date=${{ steps.info.outputs.date }}
            summary=Redacto KMS manages, stores, and distributes secrets, certificates, and keys
            description=Redacto KMS manages, stores, and distributes sensitive data including secrets, certificates, and keys, with tight access control and a detailed audit log
            url=${{ github.server_url }}/${{ github.repository }}
            vcs-ref=${{ steps.info.outputs.sha }}
            vcs-type=git
            org.opencontainers.image.authors=Redacto KMS
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ steps.info.outputs.sha }}
            org.opencontainers.image.vendor=Redacto KMS
            org.opencontainers.image.licenses=*
            org.opencontainers.image.title=Redacto KMS
            org.opencontainers.image.description=Redacto KMS manages, stores, and distributes secrets, certificates, and keys

      - name: Sign images w/ Cosign
        run: |
          images=""
          for tag in $(jq -r '.[]' <<< "$TAGS"); do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
